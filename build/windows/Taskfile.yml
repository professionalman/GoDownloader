version: '3'

tasks:
  build:
    summary: Builds the application for Windows
    cmds:
      - task: build:native
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'

  build:native:
    summary: Builds the application using native Go compilation
    internal: true
    deps:
      - task: :common:build:frontend
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - 'go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe" ./cmd/desktop'
      - cmd: powershell -Command "if (Test-Path cmd/desktop/*.syso) { Remove-Item cmd/desktop/*.syso }"
        platforms: [windows]
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -buildvcs=false -ldflags="-w -s -X downloader/internal/buildinfo.Version=0.9.1"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: '1'
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: Packages the Windows NSIS installer fixture
    deps:
      - task: build:native
        vars:
          ARCH: '{{.ARCH}}'
          DEV: "false"
    cmds:
      - cmd: powershell -Command "if (Get-Command makensis -ErrorAction SilentlyContinue) { makensis build/windows/installer.nsi } elseif (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe') { & 'C:\Program Files (x86)\NSIS\makensis.exe' build/windows/installer.nsi } elseif (Test-Path 'C:\Program Files\NSIS\makensis.exe') { & 'C:\Program Files\NSIS\makensis.exe' build/windows/installer.nsi } else { Write-Error 'makensis not found'; exit 1 }"
        platforms: [windows]

  generate:syso:
    summary: Generates Windows .syso file
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out cmd/desktop/wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  run:
    summary: Runs the application
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
