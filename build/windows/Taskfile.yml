version: '3'

tasks:
  build:
    summary: Builds the application for Windows
    cmds:
      - task: build:native
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'

  build:native:
    summary: Builds the application using native Go compilation
    internal: true
    deps:
      - task: :common:build:frontend
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - 'go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe" ./cmd/desktop'
      - cmd: powershell -Command "if (Test-Path cmd/desktop/*.syso) { Remove-Item cmd/desktop/*.syso }"
        platforms: [windows]
    vars:
      # Release provenance: source commit, whether tracked files had uncommitted changes, and the build configuration
      # are injected into internal/buildinfo (reported by `GoDownloader.exe --print-build-info` and the support
      # bundle).
      GIT_COMMIT:
        sh: git rev-parse HEAD
      # Dirty if any tracked change or any untracked (non-ignored) file exists: untracked sources are compiled in too.
      GIT_MODIFIED:
        sh: test -z "$(git status --porcelain --untracked-files=normal)" && echo false || echo true
      # Release builds should pass GO_TRIMPATH=-trimpath to keep build-machine source paths out of the binary. It is
      # opt-in because -trimpath forces runtime/cgo to be rebuilt, which needs a working cgo toolchain.
      GO_TRIMPATH: '{{.GO_TRIMPATH | default ""}}'
      # -H windowsgui links the production executable for the Windows GUI subsystem (PE subsystem 2), so launching it
      # opens no console window. write-build-manifest.ps1 refuses a console-subsystem executable as a candidate.
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -buildvcs=false {{.GO_TRIMPATH}} -ldflags="-w -s -H windowsgui -X downloader/internal/buildinfo.Version=0.9.1 -X downloader/internal/buildinfo.Commit={{.GIT_COMMIT}} -X downloader/internal/buildinfo.Modified={{.GIT_MODIFIED}} -X downloader/internal/buildinfo.Configuration=production"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: '1'
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: Packages the Windows NSIS installer fixture
    deps:
      - task: build:native
        vars:
          ARCH: '{{.ARCH}}'
          DEV: "false"
    cmds:
      # NSIS reads the executable from, and writes the installer to, the same {{.BIN_DIR}} the desktop build used and
      # the manifest step hashes (passed to makensis as an absolute /DBIN_DIR; installer.nsi has no default).
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File build/windows/package-installer.ps1 -BinDir "{{.BIN_DIR}}" -AppName "{{.APP_NAME}}" -InstallerName "GoDownloader-0.9.1-beta-windows-amd64-setup.exe"
        platforms: [windows]
      # Traceability record for the produced artifacts: version, source commit, file names, SHA-256 digests and the
      # build invocation. It is neither a signature nor a bit-for-bit reproducibility claim.
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File build/windows/write-build-manifest.ps1 -Version 0.9.1 -Invocation "wails3 task windows:package" -Artifacts "{{.BIN_DIR}}/{{.APP_NAME}}.exe","{{.BIN_DIR}}/GoDownloader-0.9.1-beta-windows-amd64-setup.exe" -OutFile "{{.BIN_DIR}}/GoDownloader-0.9.1-beta-windows-amd64-build-manifest.json"
        platforms: [windows]

  generate:syso:
    summary: Generates Windows .syso file
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out cmd/desktop/wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  run:
    summary: Runs the application
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
