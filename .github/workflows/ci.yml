name: CI

on:
  push:
    branches:
      - main
      - dev
      - feat/v0.7-lovable-integration
      - feat/v0.7.1-authenticated-media
      - feat/v0.7.2-subtitles
  pull_request:
    branches:
      - main
      - dev
      - feat/v0.7-lovable-integration
      - feat/v0.7.1-authenticated-media
      - feat/v0.7.2-subtitles

# Verification only: read-only token, no packaging, signing, or publication.
permissions:
  contents: read

jobs:
  backend:
    # The product is a Windows desktop application: the desktop host links Wails' Windows webview backend, and the
    # Job Object process-tree tests are Windows-only. The Windows runner also provides the C toolchain that the
    # Go race detector (cgo) requires.
    name: Go Backend Verification (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep repository line endings (LF) for gofmt
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify gofmt formatting
        run: |
          files=$(gofmt -l ./cmd ./internal)
          if [ -n "$files" ]; then
            echo "The following files require gofmt formatting:"
            echo "$files"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Build server
        run: go build -o "$RUNNER_TEMP/godownloader-server.exe" ./cmd/server

      # NSIS is not part of the hosted Windows image. Without it the NSIS-backed packaging regression tests skip, and a
      # plain `go test` still reports the package as ok. Install the pinned compiler and put it on PATH for every
      # later step (including the full and race test runs).
      - name: Install NSIS (pinned)
        shell: pwsh
        run: |
          choco install nsis --version=3.12.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed (choco exit $LASTEXITCODE)" }
          $roots = @(${env:ProgramFiles(x86)}, $env:ProgramFiles) | Where-Object { $_ }
          $makensis = $roots | ForEach-Object { Join-Path $_ 'NSIS\makensis.exe' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $makensis) {
            $makensis = Get-ChildItem -Path $roots -Filter makensis.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $makensis) { throw "makensis.exe not found after installing NSIS" }
          $version = (& $makensis /VERSION | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "makensis.exe is not executable (exit $LASTEXITCODE)" }
          if ($version -ne 'v3.12') { throw "unexpected NSIS version '$version' (expected v3.12)" }
          Write-Output "makensis: $makensis ($version)"
          Split-Path -Parent $makensis | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # The packaging tests are launched from bash (like the other test steps); their machine-readable results are
      # saved and checked in the next step.
      - name: Run NSIS packaging regression tests
        run: |
          set +e
          go test -count=1 -json -run '^TestPackaging_' ./build/ > "$RUNNER_TEMP/packaging-tests.json"
          echo $? > "$RUNNER_TEMP/packaging-tests.exit"
          exit 0

      - name: Require every packaging test to execute and pass
        shell: pwsh
        run: |
          $expected = @(
            'TestPackaging_DefaultOutputDirectory',
            'TestPackaging_CustomDirectoryWithSpacesIgnoresDefaultFolder',
            'TestPackaging_MissingExecutableFailsBeforePackaging',
            'TestPackaging_MissingOutputDirectoryFails',
            'TestPackaging_InstallerScriptRequiresExplicitBinDir',
            'TestPackaging_TaskfileStepsAgreeOnArtifactLocations',
            'TestPackaging_ManifestHashesTheSelectedArtifacts'
          )
          $goExit = [int](Get-Content -LiteralPath "$env:RUNNER_TEMP/packaging-tests.exit")
          $results = @{}
          foreach ($text in (Get-Content -LiteralPath "$env:RUNNER_TEMP/packaging-tests.json")) {
            if (-not $text.StartsWith('{')) { Write-Output $text; continue }
            $e = $text | ConvertFrom-Json
            if ($e.Action -eq 'output' -and $e.Output) { Write-Host -NoNewline $e.Output }
            if ($e.Test -and -not $e.Test.Contains('/') -and $e.Action -in @('pass', 'fail', 'skip')) { $results[$e.Test] = $e.Action }
          }
          Write-Output ''
          Write-Output 'Packaging test results:'
          foreach ($name in $expected) { Write-Output ('  {0,-7} {1}' -f ($results[$name] ?? 'missing').ToUpper(), $name) }
          foreach ($name in ($results.Keys | Where-Object { $_ -notin $expected } | Sort-Object)) {
            Write-Output ('  {0,-7} {1} (not in the expected inventory)' -f $results[$name].ToUpper(), $name)
          }
          $notPassed = @($results.Keys | Where-Object { $results[$_] -ne 'pass' }) + @($expected | Where-Object { -not $results.ContainsKey($_) })
          if ($goExit -ne 0 -or $notPassed.Count -gt 0) {
            throw "Packaging tests did not all execute and pass (go test exit $goExit; not passed: $($notPassed -join ', '))."
          }
          Write-Output "All $($expected.Count) expected packaging tests executed and passed (none skipped)."

      - name: Run unit tests
        run: go test -count=1 ./...

      - name: Show C toolchain used by the race detector
        run: |
          go env CC CGO_ENABLED
          gcc --version

      - name: Run unit tests with race detector
        env:
          CGO_ENABLED: '1'
        run: go test -count=1 -race -timeout 30m ./...

  frontend:
    name: Web Frontend Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest unit tests
        run: npm test -- --run

      - name: Run linter
        run: npm run lint

      - name: Run production build
        run: npm run build
